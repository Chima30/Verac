name: Contracts

# Builds the Solidity contracts and runs the Foundry test suite (unit, fuzz and invariant tests) on every push and pull
# request that touches them. Needs no secrets and talks to no chain.
on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # OpenZeppelin comes from contracts/node_modules (see foundry.toml remappings); contracts/ has its own lockfile.
      - name: Install OpenZeppelin
        run: pnpm install --frozen-lockfile --ignore-workspace

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      # Failing tests are also published as annotations, which are public, so a failure can be read without the logs.
      - name: Test
        shell: bash
        run: |
          set +e
          set -o pipefail
          forge test -vv --color never 2>&1 | tee forge-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' forge-test.log | grep -E "FAIL|[Ee]rror|panicked|Suite result" | head -10 | while IFS= read -r line; do echo "::error title=forge test::${line}"; done
            tail -n 25 forge-test.log | sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::error title=forge tail::/'
          fi
          exit "$status"

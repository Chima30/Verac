name: Contracts

# Builds the Solidity contracts and runs the Foundry test suite (unit, fuzz and invariant tests) on every push and pull
# request that touches them. Needs no secrets and talks to no chain.
on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # OpenZeppelin comes from contracts/node_modules (see foundry.toml remappings); contracts/ has its own lockfile.
      - name: Install OpenZeppelin
        run: pnpm install --frozen-lockfile --ignore-workspace

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

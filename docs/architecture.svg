<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 512" width="560" height="512" font-family="Inter Tight, Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Verac architecture: the chain of control">
  <title>Verac architecture: the chain of control</title>
  <rect width="560" height="512" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#4d4d4d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="66" y="54" width="428" height="192" rx="4" fill="none" stroke="#b5b5b5" stroke-dasharray="5 5"/>
  <text x="78" y="71" fill="#4d4d4d" font-family="Geist Mono, Menlo, Consolas, monospace" font-size="11" font-weight="500">VERAC SERVER · HOLDS NO ADMIN KEY</text>
  <rect x="90" y="8" width="380" height="46" rx="4" fill="#ffffff" stroke="#d6d6d6"/>
  <text x="280" y="36" text-anchor="middle" fill="#000" font-size="15" font-weight="500">An instruction or an application</text>
  <line x1="280" y1="57" x2="280" y2="80" stroke="#4d4d4d" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="90" y="84" width="380" height="60" rx="4" fill="#ffffff" stroke="#d6d6d6"/>
  <text x="280" y="108" text-anchor="middle" fill="#000" font-size="15" font-weight="500">Six agents investigate</text>
  <text x="280" y="128" text-anchor="middle" fill="#4d4d4d" font-size="12.5">AI advises. No payment tool.</text>
  <line x1="280" y1="147" x2="280" y2="170" stroke="#4d4d4d" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="90" y="174" width="380" height="60" rx="4" fill="#ffffff" stroke="#d6d6d6"/>
  <text x="280" y="198" text-anchor="middle" fill="#000" font-size="15" font-weight="500">Fixed rules decide</text>
  <text x="280" y="218" text-anchor="middle" fill="#4d4d4d" font-size="12.5">Eligible, hold or reject</text>
  <line x1="280" y1="237" x2="280" y2="260" stroke="#4d4d4d" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="90" y="264" width="380" height="60" rx="4" fill="#ffdccd"/>
  <text x="280" y="288" text-anchor="middle" fill="#000" font-size="15" font-weight="500">Two administrators sign</text>
  <text x="280" y="308" text-anchor="middle" fill="#4d4d4d" font-size="12.5">Post-quantum keys, on their own devices</text>
  <line x1="280" y1="327" x2="280" y2="350" stroke="#4d4d4d" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="90" y="354" width="380" height="60" rx="4" fill="#c8f6f9"/>
  <text x="280" y="378" text-anchor="middle" fill="#000" font-size="15" font-weight="500">QoreChain enforces</text>
  <text x="280" y="398" text-anchor="middle" fill="#4d4d4d" font-size="12.5">Signatures, caps, vault-only windows</text>
  <line x1="280" y1="417" x2="280" y2="440" stroke="#4d4d4d" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="90" y="444" width="380" height="60" rx="4" fill="#ffffff" stroke="#d6d6d6"/>
  <text x="280" y="468" text-anchor="middle" fill="#000" font-size="15" font-weight="500">A receipt on Live Proof</text>
  <text x="280" y="488" text-anchor="middle" fill="#4d4d4d" font-size="12.5">Re-read from the chain</text>
</svg>

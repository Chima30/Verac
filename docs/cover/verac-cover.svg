  <line x1="934" y1="428" x2="934" y2="650" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>
  <g font-size="24" font-weight="600" fill="#f5f5f4">
    <circle cx="934" cy="428" r="9" fill="#2dd4bf"/><text x="966" y="436">Requested</text>
